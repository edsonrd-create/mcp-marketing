name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version label (informational)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  release:
    name: Build and package release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: production
      WHATSAPP_STUB: 'true'
      GOOGLE_ADS_CLIENT_ID: mock-client-id
      GOOGLE_ADS_CLIENT_SECRET: mock-client-secret
      GOOGLE_ADS_DEVELOPER_TOKEN: mock-developer-token
      GOOGLE_ADS_REFRESH_TOKEN: mock-refresh-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build info
        run: npm run build:info

      - name: Package release
        run: npm run package:release

      - name: Sanitize release name
        id: release_name
        run: |
          CLEAN_REF=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '\\' '-')
          echo "clean_ref=${CLEAN_REF}" >> $GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketing-brain-release-${{ steps.release_name.outputs.clean_ref }}
          path: |
            dist-release/**
            VERSION
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/**
            VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
