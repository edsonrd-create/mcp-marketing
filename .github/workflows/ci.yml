name: CI

on:
  push:
    branches: [master, main, 'cursor/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NODE_ENV: test
      WHATSAPP_STUB: 'true'
      GOOGLE_ADS_CLIENT_ID: mock-client-id
      GOOGLE_ADS_CLIENT_SECRET: mock-client-secret
      GOOGLE_ADS_DEVELOPER_TOKEN: mock-developer-token
      GOOGLE_ADS_REFRESH_TOKEN: mock-refresh-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Validate
        run: npm run validate

      - name: Doctor Check
        run: npm run doctor

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ github.sha }}
          path: |
            shared/dist/
            mcp-*/dist/
            dist-app/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload VERSION
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-${{ github.sha }}
          path: VERSION
          if-no-files-found: ignore
          retention-days: 14
